<div style="background: var(--surface-1); border-radius: 12px; padding: 1.25rem;">
  <h2 class="sr-only">浓度配液控制系统触摸屏HMI界面，包含运行状态、流量温度pH监测、启停控制和阀门泵状态</h2>

  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <span id="run-dot" style="width: 12px; height: 12px; border-radius: 50%; background: var(--gray-400, #888780); display: inline-block;"></span>
      <span style="font-size: 16px; font-weight: 500;" id="run-text">系统停止</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="font-size: 13px; color: var(--text-secondary);">手动</span>
      <label style="position: relative; display: inline-block; width: 44px; height: 24px;">
        <input type="checkbox" id="mode-toggle" style="opacity:0; width:0; height:0;">
        <span id="mode-slider" style="position:absolute; cursor:pointer; inset:0; background: var(--border-strong); border-radius: 24px; transition: .2s;"></span>
        <span id="mode-knob" style="position:absolute; height:18px; width:18px; left:3px; bottom:3px; background:white; border-radius:50%; transition:.2s;"></span>
      </label>
      <span style="font-size: 13px; color: var(--text-secondary);">自动</span>
    </div>
  </div>

  <div id="alarm-banner" style="display:none; background: var(--bg-danger); color: var(--text-danger); font-size: 13px; font-weight: 500; padding: 8px 12px; border-radius: var(--radius); margin-bottom: 1rem;">
    <i class="ti ti-alert-triangle" style="vertical-align:-2px; margin-right:6px;" aria-hidden="true"></i>
    <span id="alarm-text">--</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1.25rem;">
    <div style="background: var(--surface-2); border-radius: var(--radius); padding: 0.85rem; text-align:center;">
      <p style="font-size: 12px; color: var(--text-secondary); margin: 0 0 6px;"><i class="ti ti-droplet" style="font-size:15px; vertical-align:-2px; margin-right:4px;" aria-hidden="true"></i>水流量</p>
      <p style="font-size: 22px; font-weight: 500; margin: 0;" id="flow-val">0.0</p>
      <p style="font-size: 11px; color: var(--text-muted); margin: 2px 0 0;">L/min</p>
    </div>
    <div style="background: var(--surface-2); border-radius: var(--radius); padding: 0.85rem; text-align:center;">
      <p style="font-size: 12px; color: var(--text-secondary); margin: 0 0 6px;"><i class="ti ti-temperature" style="font-size:15px; vertical-align:-2px; margin-right:4px;" aria-hidden="true"></i>温度</p>
      <p style="font-size: 22px; font-weight: 500; margin: 0;" id="temp-val">0.0</p>
      <p style="font-size: 11px; color: var(--text-muted); margin: 2px 0 0;">℃</p>
    </div>
    <div style="background: var(--surface-2); border-radius: var(--radius); padding: 0.85rem; text-align:center;">
      <p style="font-size: 12px; color: var(--text-secondary); margin: 0 0 6px;"><i class="ti ti-flask" style="font-size:15px; vertical-align:-2px; margin-right:4px;" aria-hidden="true"></i>pH值</p>
      <p style="font-size: 22px; font-weight: 500; margin: 0;" id="ph-val">0.0</p>
      <p style="font-size: 11px; color: var(--text-muted); margin: 2px 0 0;">pH</p>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1.25rem;">
    <div>
      <label style="font-size: 12px; color: var(--text-secondary); display:block; margin-bottom: 4px;">目标浓度 (%)</label>
      <input type="number" id="c-set" value="5" step="0.1" min="0" style="width: 100%; height: 40px; font-size: 15px;">
    </div>
    <div>
      <label style="font-size: 12px; color: var(--text-secondary); display:block; margin-bottom: 4px;">母液浓度 (%)</label>
      <input type="number" id="c-stock" value="20" step="0.1" min="0" style="width: 100%; height: 40px; font-size: 15px;">
    </div>
  </div>

  <div style="background: var(--surface-2); border-radius: var(--radius); padding: 0.75rem 1rem; margin-bottom: 1.25rem; display:flex; justify-content: space-between; align-items:center;">
    <span style="font-size: 13px; color: var(--text-secondary);">加药泵目标流量</span>
    <span style="font-size: 16px; font-weight: 500;" id="dose-val">0.00 L/min</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1.25rem;">
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
      <span id="valve-in-dot" style="width:14px; height:14px; border-radius:50%; background: var(--gray-400,#888780);"></span>
      <span style="font-size: 12px; color: var(--text-secondary);">进水阀</span>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
      <span id="pump-dot" style="width:14px; height:14px; border-radius:50%; background: var(--gray-400,#888780);"></span>
      <span style="font-size: 12px; color: var(--text-secondary);">加药泵</span>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
      <span id="valve-out-dot" style="width:14px; height:14px; border-radius:50%; background: var(--gray-400,#888780);"></span>
      <span style="font-size: 12px; color: var(--text-secondary);">排水阀</span>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
    <button id="start-btn" style="height: 56px; font-size: 16px; font-weight: 500; background: var(--fill-success, #639922); color: white; border: none;">
      <i class="ti ti-player-play" style="vertical-align:-3px; margin-right:6px;" aria-hidden="true"></i>启动
    </button>
    <button id="stop-btn" style="height: 56px; font-size: 16px; font-weight: 500; background: var(--fill-danger, #E24B4A); color: white; border: none;">
      <i class="ti ti-player-stop" style="vertical-align:-3px; margin-right:6px;" aria-hidden="true"></i>停止
    </button>
  </div>

  <button id="estop-btn" style="width: 100%; height: 64px; font-size: 17px; font-weight: 500; background: var(--c-red-600, #A32D2D); color: white; border: 2px solid var(--c-red-800, #791F1F);">
    <i class="ti ti-hand-stop" style="vertical-align:-3px; margin-right:6px;" aria-hidden="true"></i>急停
  </button>
</div>

<script>
(function() {
  var running = false;
  var flow = 0, temp = 22, ph = 7.0;
  var timer = null;

  var runDot = document.getElementById('run-dot');
  var runText = document.getElementById('run-text');
  var flowVal = document.getElementById('flow-val');
  var tempVal = document.getElementById('temp-val');
  var phVal = document.getElementById('ph-val');
  var doseVal = document.getElementById('dose-val');
  var valveIn = document.getElementById('valve-in-dot');
  var pumpDot = document.getElementById('pump-dot');
  var valveOut = document.getElementById('valve-out-dot');
  var alarmBanner = document.getElementById('alarm-banner');
  var alarmText = document.getElementById('alarm-text');
  var modeToggle = document.getElementById('mode-toggle');
  var modeSlider = document.getElementById('mode-slider');
  var modeKnob = document.getElementById('mode-knob');

  function setDot(el, on, color) {
    el.style.background = on ? color : 'var(--gray-400, #888780)';
  }

  function updateMode() {
    if (modeToggle.checked) {
      modeSlider.style.background = 'var(--fill-success, #639922)';
      modeKnob.style.transform = 'translateX(20px)';
    } else {
      modeSlider.style.background = 'var(--border-strong)';
      modeKnob.style.transform = 'translateX(0)';
    }
  }
  modeToggle.addEventListener('change', updateMode);
  updateMode();

  function tick() {
    if (!running) return;
    flow = Math.min(10, flow + 0.8 + Math.random() * 0.3);
    temp = 22 + Math.sin(Date.now()/5000) * 1.5 + (Math.random()-0.5)*0.3;
    ph = 7.0 + Math.sin(Date.now()/4000) * 0.3 + (Math.random()-0.5)*0.1;

    var cSet = parseFloat(document.getElementById('c-set').value) || 0;
    var cStock = parseFloat(document.getElementById('c-stock').value) || 1;
    var dose = flow * cSet / cStock;

    flowVal.textContent = flow.toFixed(1);
    tempVal.textContent = temp.toFixed(1);
    phVal.textContent = ph.toFixed(1);
    doseVal.textContent = dose.toFixed(2) + ' L/min';

    setDot(valveIn, flow < 9.5, 'var(--fill-accent, #378ADD)');
    setDot(pumpDot, flow > 0.5, 'var(--fill-success, #639922)');
    setDot(valveOut, false, 'var(--fill-accent, #378ADD)');

    var alarms = [];
    if (temp > 35 || temp < 15) alarms.push('温度超限');
    if (ph > 9 || ph < 6) alarms.push('pH超限');
    if (alarms.length > 0) {
      alarmBanner.style.display = 'block';
      alarmText.textContent = alarms.join(' / ');
    } else {
      alarmBanner.style.display = 'none';
    }
  }

  function start() {
    running = true;
    runDot.style.background = 'var(--fill-success, #639922)';
    runText.textContent = '系统运行中';
    if (timer) clearInterval(timer);
    timer = setInterval(tick, 900);
  }

  function stop() {
    running = false;
    runDot.style.background = 'var(--gray-400, #888780)';
    runText.textContent = '系统停止';
    if (timer) clearInterval(timer);
    flow = 0; 
    flowVal.textContent = '0.0';
    doseVal.textContent = '0.00 L/min';
    setDot(valveIn, false, '');
    setDot(pumpDot, false, '');
    setDot(valveOut, false, '');
    alarmBanner.style.display = 'none';
  }

  document.getElementById('start-btn').addEventListener('click', start);
  document.getElementById('stop-btn').addEventListener('click', stop);
  document.getElementById('estop-btn').addEventListener('click', function() {
    stop();
    alarmBanner.style.display = 'block';
    alarmText.textContent = '急停触发';
  });
})();
</script>
